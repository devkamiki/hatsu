services:
  hatsu:
    build: .
    image: hatsu:local
    ports:
      - "8080:8080"
    environment:
      HATSU_PORT: "8080"
      HATSU_HKP: "https://keys.openpgp.org"
      HATSU_DEMO: "1"
      HATSU_DEFAULT_EMAIL: "demo@example.com"
      HATSU_DEFAULT_IMAP_HOST: greenmail
      HATSU_DEFAULT_IMAP_PORT: "3143"
      HATSU_DEFAULT_IMAP_SECURE: "0"
      HATSU_DEFAULT_SMTP_HOST: greenmail
      HATSU_DEFAULT_SMTP_PORT: "3025"
      HATSU_DEFAULT_SMTP_SECURE: "0"
      HATSU_DEFAULT_CALDAV: "http://radicale:5232"
      HATSU_DEFAULT_CARDDAV: "http://radicale:5232"
      HATSU_DEFAULT_TLS_INSECURE: "1"
    depends_on:
      - greenmail
      - radicale
    restart: unless-stopped
    networks: [hatsu]

  # Local IMAP/SMTP. Any email + password works.
  # From the Hatsu container the hostname is "greenmail" (not localhost).
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=true
        -Dgreenmail.users.login=email
        -Dgreenmail.users=demo:demo@example.com
    ports:
      - "3025:3025"
      - "3143:3143"
      - "3465:3465"
      - "3993:3993"
    restart: unless-stopped
    networks:
      hatsu:
        aliases: [greenmail, mail]

  radicale:
    image: tomsquest/docker-radicale:3.5.4.0
    volumes:
      - radicale-data:/data
      - ./deploy/radicale/config:/config/config:ro
    ports:
      - "5232:5232"
    restart: unless-stopped
    networks: [hatsu]

volumes:
  radicale-data:

networks:
  hatsu:
    driver: bridge
